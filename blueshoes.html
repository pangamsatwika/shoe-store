
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shoe Product Page</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #fff;
            color: #333;
        }

        .goback {
            max-width: 1100px;
            margin: 25px auto 0;
            padding: 0 20px;
            font-size: 22px;
            cursor: pointer;
        }

        .product-container {
            display: flex;
            align-items: center;
            gap: 50px;
            max-width: 1100px;
            margin: 25px auto 50px;
            padding: 20px;
        }

        .product-image {
            width: 50%;
        }

        .product-image img {
            width: 100%;
            height: 500px;
            object-fit: cover;
            border-radius: 15px;
            display: block;
        }

        .product-details {
            width: 50%;
        }

        .brand {
            display: flex;
            flex-direction: row;
            justify-content: flex-start;
            gap: 20px;
            margin-bottom: 25px;
            font-size: 20px;
        }

        .brand i {
            cursor: pointer;
        }

        .product-details h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: gray;
            margin-bottom: 15px;
        }

        .rating {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .rating span {
            color: orange;
            font-size: 14px;
        }

        .rating p {
            font-size: 14px;
        }

        .price {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .price h2 {
            color: #6b3f24;
            font-size: 30px;
        }

        .price del {
            color: gray;
        }

        .discount {
            color: green;
            font-weight: bold;
        }

        .description {
            color: #625c56;
            line-height: 1.7;
            margin-bottom: 20px;
        }

        .buttons {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        button {
            padding: 14px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
            transition: 0.3s;
        }

        .cart-btn {
            background-color: white;
            color: #6b3f24;
            border: 2px solid #6b3f24;
            width: 50%;
        }

        .cart-btn:hover {
            background-color: #f0e5d9;
        }

        .buy-btn {
            background-color: #6b3f24;
            color: white;
            border: 2px solid #6b3f24;
            width: 50%;
        }

        .buy-btn:hover {
            background-color: #4e2d19;
        }

        footer {
            text-align: center;
            padding: 20px;
            background-color: white;
            color: gray;
        }

        /* Tablet and mobile */
        @media (max-width: 768px) {
            .product-container {
                gap: 25px;
            }

            .product-image img {
                height: 400px;
            }
        }

        @media (max-width: 546px) {
            .goback {
                margin: 15px 20px 0;
                padding: 0;
            }

            .product-container {
                flex-direction: column;
                margin: 15px auto 30px;
                padding: 15px;
                gap: 25px;
            }

            .product-image,
            .product-details {
                width: 100%;
            }

            .product-image img {
                height: 350px;
            }

            .product-details h1 {
                font-size: 25px;
            }

            .brand {
                justify-content: flex-end;
                margin-bottom: 20px;
            }

            .buttons {
                gap: 10px;
            }

            button {
                padding: 12px 10px;
                font-size: 14px;
            }

            footer {
                text-align: center;
            }
        }
    </style>
</head>

<body>

    <div class="goback">
        <a href="C:\Users\satwi\OneDrive\Desktop\websites\index.html"><i class="fa-solid fa-arrow-left"></i></a>
    </div>

    <section class="product-container" id="product">

        <div class="product-image">
            <img src="b.jpg" alt="Blue Training Shoe">
        </div>

        <div class="product-details">

            <span class="brand">
                <i class="fa-regular fa-heart"></i>
                <i class="fa-regular fa-comment"></i>
                <i class="fa-solid fa-share-nodes"></i>
            </span>

            <h1>Blue Training Shoe</h1>

            <p class="subtitle">
                Classic Stitching | Lightweight | Comfortable
            </p>

            <div class="rating">
                <span>
                    <i class="fa-solid fa-star"></i>
                    <i class="fa-solid fa-star"></i>
                    <i class="fa-solid fa-star"></i>
                    <i class="fa-solid fa-star"></i>
                    <i class="fa-solid fa-star"></i>
                </span>
                <p>4.8/5</p>
            </div>

            <div class="price">
                <h2>₹599</h2>
                <del>₹999</del>
                <span class="discount">38% OFF</span>
            </div>

            <p class="description">
                Stylish Blue Training Shoe with a classic stitched design.
                These lightweight casual shoes are comfortable for everyday
                wear, school, and outings.
            </p>

            <div class="buttons" id="cart">
                <button class="cart-btn">Add to Cart</button>
                <button class="buy-btn">Buy Now</button>
            </div>

        </div>
    </section>

    <footer>
        <p>© 2026 Shoe Store. All Rights Reserved.</p>
    </footer>

</body>
</html>
